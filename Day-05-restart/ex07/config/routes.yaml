ex07_index:
    path: /ex07
    controller: App\Ex07Bundle\Controller\Ex07Controller::index

ex07_create:
    path: /ex07/create
    controller: App\Ex07Bundle\Controller\Ex07Controller::createRandomUsers

ex07_edit:
    path: /ex07/edit/{id}
    controller: App\Ex07Bundle\Controller\Ex07Controller::editUser
    requirements:
        id: '\d+'